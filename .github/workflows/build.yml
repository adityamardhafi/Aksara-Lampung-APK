name: Build Kivy APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-dev zip unzip libtool libtool-bin autoconf automake m4 pkg-config libffi-dev libssl-dev openjdk-17-jdk
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
      
      - name: Build APK with Auto-Bypass
        run: |
          # 1. Mulai perakitan secara normal
          if ! yes | buildozer -v android debug; then
            
            # 2. Jika gagal (karena Savannah mati), kita bajak kodenya dan ganti dengan server Kanada
            echo "Mendeteksi server Savannah mati. Melakukan injeksi server cermin (Mirror)..."
            find .buildozer/android/platform/python-for-android -type f -name "__init__.py" -exec sed -i 's/download.savannah.gnu.org\/releases/mirror.csclub.uwaterloo.ca\/nongnu/g' {} + || true
            
            # 3. Lanjutkan kembali perakitan dengan server yang baru
            echo "Mencoba melanjutkan perakitan..."
            yes | buildozer -v android debug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-skripsi
          path: bin/*.apk

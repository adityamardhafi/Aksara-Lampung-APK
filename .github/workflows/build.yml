name: Build Kivy APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-dev zip unzip libtool libtool-bin autoconf automake m4 pkg-config libffi-dev libssl-dev openjdk-17-jdk
          pip install --upgrade "pip<24.1"
          pip install buildozer cython==0.29.33
      
      - name: Bait, Patch, and Build (Ultimate Fix)
        run: |
          # 1. PANCINGAN: Biarkan Buildozer mengunduh kerangka p4a.
          echo "Tahap 1: Memancing pengunduhan kerangka perakit..."
          yes | buildozer -v android debug || true
          
          # 2. OPERASI BEDAH GANDA
          echo "Tahap 2: Menambal URL Freetype & Mencegah keruntuhan Pip..."
          P4A_DIR=".buildozer/android/platform/python-for-android"
          if [ -d "$P4A_DIR" ]; then
            # Patch 1: Bypass Server Savannah ke Mirror Kanada
            find "$P4A_DIR" -type f -name "*.py" -exec sed -i 's/download.savannah.gnu.org\/releases/mirror.csclub.uwaterloo.ca\/nongnu/g' {} + || true
            find "$P4A_DIR" -type f -name "*.py" -exec sed -i 's/download.savannah.nongnu.org\/releases/mirror.csclub.uwaterloo.ca\/nongnu/g' {} + || true
            
            # Patch 2: Kunci versi pip di dalam build.py p4a agar tidak meledak
            find "$P4A_DIR" -type f -name "build.py" -exec sed -i 's/pip install -U pip/pip install "pip<24.1"/g' {} + || true
            
            echo "Patch Ganda berhasil diterapkan!"
          else
            echo "Peringatan: Folder p4a tidak ditemukan. Patch dilewati."
          fi
          
          # 3. EKSEKUSI FINAL: Lanjutkan kompilasi.
          echo "Tahap 3: Melanjutkan perakitan APK..."
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-skripsi
          path: bin/*.apk

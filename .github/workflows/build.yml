name: Build Kivy APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system dependencies & Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-dev zip unzip libtool libtool-bin autoconf automake m4 pkg-config libffi-dev libssl-dev openjdk-17-jdk
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
      
      - name: Surgical Patch (Bypass Savannah Server)
        run: |
          # 1. Melacak direktori instalasi asli python-for-android di dalam mesin
          P4A_DIR=$(python3 -c "import pythonforandroid; print(pythonforandroid.__path__[0])")
          echo "Menemukan jantung kerangka perakit di: $P4A_DIR"
          
          # 2. Operasi bedah teks: Ganti semua URL Savannah (yang sering mati) dengan Mirror Kanada
          find "$P4A_DIR" -type f -name "*.py" -exec sed -i 's/download.savannah.gnu.org\/releases/mirror.csclub.uwaterloo.ca\/nongnu/g' {} +
          find "$P4A_DIR" -type f -name "*.py" -exec sed -i 's/download.savannah.nongnu.org\/releases/mirror.csclub.uwaterloo.ca\/nongnu/g' {} +
          
          echo "Operasi bedah berhasil! URL telah ditambal."

      - name: Build APK with Buildozer
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 15
          command: yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-skripsi
          path: bin/*.apk

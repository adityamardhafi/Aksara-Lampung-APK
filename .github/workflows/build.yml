name: Build Kivy APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-dev zip unzip libtool libtool-bin autoconf automake m4 pkg-config libffi-dev libssl-dev openjdk-17-jdk
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
      
      - name: Bait and Patch Server (Expert Fix)
        run: |
          # 1. PANCINGAN: Biarkan Buildozer mengunduh komponen stabil bawaannya. 
          # Perintah ini sengaja dibiarkan gagal saat menabrak server Savannah yang mati.
          echo "Memulai perakitan tahap 1 (Mengunduh kerangka stabil)..."
          yes | buildozer -v android debug || true
          
          # 2. TAMBALAN: Setelah kerangkanya terunduh, kita injeksi URL server Kanada (Mirror).
          echo "Menerapkan patch server Freetype (Savannah -> Kanada)..."
          find .buildozer/android/platform/python-for-android -type f -name "*.py" -exec sed -i 's/download.savannah.gnu.org\/releases/mirror.csclub.uwaterloo.ca\/nongnu/g' {} + || true
          
          # 3. LANJUTAN: Lanjutkan perakitan dengan kerangka yang sudah ditambal.
          echo "Melanjutkan perakitan tahap akhir..."
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-skripsi
          path: bin/*.apk

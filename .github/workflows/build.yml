name: Build Kivy APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-dev zip unzip libtool libtool-bin autoconf automake m4 pkg-config libffi-dev libssl-dev
          pip install --upgrade "pip<24.1"
          pip install buildozer cython==0.29.33
      
      - name: The Indestructible Build (Auto-Resume)
        run: |
          echo "Tahap 1: Memancing pengunduhan kerangka awal..."
          yes | buildozer -v android debug || true
          
          echo "Tahap 2: Operasi Bedah Infrastruktur..."
          export P4A_DIR=".buildozer/android/platform/python-for-android"
          if [ -d "$P4A_DIR" ]; then
            find "$P4A_DIR" -type f -name "*.py" -exec sed -i 's/download.savannah.gnu.org\/releases/mirror.csclub.uwaterloo.ca\/nongnu/g' {} + || true
            find "$P4A_DIR" -type f -name "*.py" -exec sed -i 's/download.savannah.nongnu.org\/releases/mirror.csclub.uwaterloo.ca\/nongnu/g' {} + || true
            find "$P4A_DIR" -type f -name "build.py" -exec sed -i 's/pip install -U pip/pip install "pip<24.1"/g' {} + || true
          fi
          
          echo "Tahap 3: Eksekusi Final dengan Loop Penahan Time-out..."
          SUCCESS=0
          for i in {1..5}; do
            echo "Mencoba perakitan (Percobaan ke-$i)..."
            if yes | buildozer -v android debug; then
              echo "Perakitan APK Sukses!"
              SUCCESS=1
              break
            else
              echo "Terjadi interupsi/error. Menunggu 10 detik..."
              sleep 10
            fi
          done
          
          if [ $SUCCESS -eq 0 ]; then
            echo "Gagal merakit setelah 5 percobaan. Mematikan sistem."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-skripsi
          path: bin/*.apk

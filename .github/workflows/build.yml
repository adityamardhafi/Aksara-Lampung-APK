name: Build Kivy APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-dev zip unzip libtool libtool-bin autoconf automake m4 pkg-config libffi-dev libssl-dev openjdk-17-jdk
          pip install --upgrade "pip<24.1"
          pip install buildozer cython==0.29.33
      
      - name: Setup Custom Toolchain & Deep Patch
        run: |
          # 1. Pengambilalihan mesin perakit (python-for-android) ke folder lokal
          git clone https://github.com/kivy/python-for-android.git
          
          # 2. Patch Infrastruktur 1: Bypass Server Savannah yang mati ke Server Kanada
          find python-for-android -type f -name "*.py" -exec sed -i 's/download.savannah.gnu.org\/releases/mirror.csclub.uwaterloo.ca\/nongnu/g' {} + || true
          
          # 3. Patch Infrastruktur 2: Cegah p4a melakukan upgrade pip yang merusak sistem
          find python-for-android -type f -name "build.py" -exec sed -i 's/pip install -U pip/pip install "pip<24.1"/g' {} + || true
          
          # 4. Paksa buildozer.spec untuk menuruti kerangka perakit yang sudah kita bedah ini
          echo "p4a.source_dir = ./python-for-android" >> buildozer.spec

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-skripsi
          path: bin/*.apk
